# ==============================================================================
# AEGIS Critical Systems - Low-Level Software Requirements Specification (SRS)
# Document ID: SRS-TRACE-001
# Standard: DO-178C / DO-330 TQL-5 | MIL-STD-882E | S1000D Issue 5.0 BREX
# ==============================================================================
document_id: SRS-TRACE-001
subsystem: 05-trace-s1000d-cli
dal_level: DAL-B
s1000d_dmc: DMC-AEGIS-A-24-30-05-00A-420A-A

requirements:
  - id: SRS-TRACE-001
    title: Bidirectional DO-178C Requirement and Hazard Traceability Verification
    dal: DAL-B
    hazard: MIL-882E-CAT-II
    fault: DTC-0x501
    description: >
      The traceability verification engine shall verify that every SRS requirement
      is linked to at least one source symbol with matching @fault and @hazard
      annotations and reject any untraced requirement or metadata mismatch.
    isolation_action: >
      Abort CI qualification gate with non-zero exit status, report missing or
      mismatched @req/@fault/@hazard links, and block release promotion.

  - id: SRS-TRACE-002
    title: FIPS 180-4 SHA-256 Lockfile Drift Detection Gate
    dal: DAL-B
    hazard: MIL-882E-CAT-II
    fault: DTC-0x502
    description: >
      The verification engine shall compute normalized FIPS 180-4 SHA-256 body
      digests for all traced safety-critical symbols and fail verification on any
      drift against requirements/trace.lock.
    isolation_action: >
      Halt build verification immediately on lockfile mismatch, require explicit
      re-audit of modified safety logic, and prevent unreviewed artifact signing.

  - id: SRS-TRACE-003
    title: S1000D Issue 5.0 BREX Business Rule Validation
    dal: DAL-B
    hazard: MIL-882E-CAT-III
    fault: DTC-0x503
    description: >
      Every compiled S1000D Fault Isolation Data Module XML document shall
      enforce securityClassification="01", BREX DM reference infoCode="022",
      and valid 64-character SHA-256 evidence digests for every FIP procedure.
    isolation_action: >
      Reject non-compliant XML emission before schema validation and emit
      explicit BREX rule violation diagnostics.
