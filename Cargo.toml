[workspace]
resolver = "2"
members = [
    "01-hybrid-can-gateway/rust_parser",
    "05-trace-s1000d-cli",
]

[workspace.package]
version = "1.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Ruben Higuita <rhiguita@student.42madrid.com>"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
panic = "abort"
lto = true
opt-level = 3
